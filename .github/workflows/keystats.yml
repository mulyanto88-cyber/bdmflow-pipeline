name: Fundamental & Key Stats Pipeline

on:
  schedule:
    - cron: '0 0,4,8,12,16,20 * * *'  # 6x sehari: 07:00, 11:00, 15:00, 19:00, 23:00, 03:00 WIB
  workflow_dispatch:
    inputs:
      limit:
        description: 'Override jumlah saham per run (kosongkan = 120 rolling update)'
        required: false
        default: ''
      retry_rounds:
        description: 'Ronde retry untuk saham KOSONG (0-5).'
        required: false
        default: '1'

concurrency:
  group: keystats-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps
      - name: Run Key Stats Pipeline
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TOKEN_SHEET_ID: ${{ secrets.TOKEN_SHEET_ID }}
          STOCKBIT_USERNAME: ${{ secrets.STOCKBIT_USERNAME }}
          STOCKBIT_PASSWORD: ${{ secrets.STOCKBIT_PASSWORD }}
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ -n "${{ github.event.inputs.retry_rounds }}" ]; then
            ARGS="$ARGS --retry-rounds ${{ github.event.inputs.retry_rounds }}"
          fi
          python scripts/fetch_keystats.py $ARGS
