name: 🏦 BrokSum + Insider Pipeline — 17:40 WIB

on:
  schedule:
    - cron: '40 10 * * 1-5'  # 17:40 WIB, Senin-Jumat
  workflow_dispatch:

concurrency:
  group: broksum-insider
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps
      - name: Run BrokSum + Insider Pipeline
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TOKEN_SHEET_ID: ${{ secrets.TOKEN_SHEET_ID }}
          STOCKBIT_USERNAME: ${{ secrets.STOCKBIT_USERNAME }}
          STOCKBIT_PASSWORD: ${{ secrets.STOCKBIT_PASSWORD }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/broksum_insider.py
